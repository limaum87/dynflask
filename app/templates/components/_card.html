{# Card component — usage: {% from 'components/_card.html' import card %} #}
{% macro card(title='', description='', class='', icon='') %}
<div class="rounded-xl border border-slate-200 bg-white shadow-sm {{ class }}">
  {% if title %}
  <div class="flex items-center gap-3 border-b border-slate-100 px-6 py-4">
    {% if icon %}
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100">
      <i data-lucide="{{ icon }}" class="h-[18px] w-[18px] text-slate-600"></i>
    </div>
    {% endif %}
    <div>
      <h3 class="text-[15px] font-semibold text-slate-900">{{ title }}</h3>
      {% if description %}
      <p class="mt-0.5 text-[13px] text-slate-500">{{ description }}</p>
      {% endif %}
    </div>
  </div>
  {% endif %}
  <div class="p-6">
    {{ caller() }}
  </div>
</div>
{% endmacro %}
